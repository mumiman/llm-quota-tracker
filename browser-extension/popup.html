<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #161922;
      color: #e6e8ef;
      font-size: 12px;
    }
    h3 { margin: 0 0 8px 0; font-size: 13px; }
    p { margin: 0 0 10px 0; color: #8b93a7; line-height: 1.4; }
    button {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 8px;
      border: 1px solid #262b38;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
    button.secondary { background: #1f2430; color: #e6e8ef; }
    button:hover { opacity: 0.9; }
    #status { margin-top: 8px; padding: 8px; border-radius: 6px; background: #0f1117; display: none; }
  </style>
</head>
<body>
  <h3>LLM Quota Tracker Sync</h3>
  <p>Open <strong>claude.ai/settings/usage</strong> or <strong>chatgpt.com/codex/settings/usage</strong>, then click Sync:</p>
  <button id="syncTabBtn">⚡ Sync Current Tab Now</button>
  <button id="openClaudeBtn" class="secondary">Open Claude Usage Page ↗</button>
  <button id="openCodexBtn" class="secondary">Open Codex Usage Page ↗</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
